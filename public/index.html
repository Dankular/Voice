<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OmniVoice Voices</title>
<link rel="icon" href="data:,">
<style>
  :root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--line:#ddd;--acc:#2563eb;--sel:#eff6ff}
  @media (prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--mut:#999;--line:#333;--acc:#60a5fa;--sel:#1e293b}}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
  main{max-width:760px;margin:0 auto;padding:24px 16px} h1{font-size:1.4rem;margin:0 0 4px}
  .sub{color:var(--mut);margin:0 0 16px} .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  input,button,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
  input{flex:1 1 130px;min-width:0} textarea{width:100%;margin:8px 0}
  button{cursor:pointer} button.primary{background:var(--acc);border-color:var(--acc);color:#fff} button:disabled{opacity:.5}
  .voice{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
  .voice.sel{border-color:var(--acc);background:var(--sel)} .voice .n{font-weight:600} .voice .d{color:var(--mut);font-size:.85rem}
  .voice .info{flex:1;min-width:0} .voice .d{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #err{color:#dc2626;min-height:1.5em} #status{color:var(--mut)} audio{width:100%;margin-top:8px}
  #speak{position:sticky;bottom:0;background:var(--bg);padding:10px 0;border-top:1px solid var(--line);margin-top:12px}
</style>
</head>
<body>
<main>
  <h1>Pick a voice, type text</h1>
  <p class="sub">Runs entirely in your browser (WebGPU + ONNX). The selected voice's sample is transcribed on the fly and cloned by OmniVoice to speak your text.</p>
  <div id="models" class="sub"></div>

  <form id="filters" class="row">
    <input name="search" placeholder="Search voices">
    <input name="gender" placeholder="Gender" list="g"><datalist id="g"><option>male</option><option>female</option></datalist>
    <input name="accent" placeholder="Accent">
    <input name="age" placeholder="Age" list="a"><datalist id="a"><option>young</option><option>middle_aged</option><option>old</option></datalist>
    <input name="language" placeholder="Language (e.g. en)">
    <button class="primary">Search</button>
  </form>

  <div id="list"></div>
  <div class="row"><button id="more" hidden>Load more</button></div>

  <div id="speak">
    <div><b id="picked">No voice selected</b></div>
    <textarea id="text" rows="3" maxlength="300" placeholder="Text to speak"></textarea>
    <div class="row"><button id="go" class="primary" disabled>Speak</button><span id="status"></span></div>
    <div id="err"></div>
    <audio id="audio" controls hidden></audio>
  </div>
</main>
<script type="module" src="/js/app.js"></script>
</body>
</html>
